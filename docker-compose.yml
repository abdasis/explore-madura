services:
  postgres:
    image: postgres:16-alpine
    container_name: bangkalan-tourism-postgres
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5439:5432"
    volumes:
      - bangkalan-tourism-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bangkalan-tourism-postgres-data:
